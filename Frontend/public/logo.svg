<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#1e3c72" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ICON SECTION ONLY -->
  <!-- The translate(10, 10) in combination with a 160x160 viewBox centers the (70,70) icon center at (80,80) -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer radar rings / globe structure -->
    <circle cx="70" cy="70" r="62" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="70" cy="70" r="50" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Concentric radar segments representing crowd density -->
    <path d="M 70 20 A 50 50 0 0 1 120 70 L 95 70 A 25 25 0 0 0 70 45 Z" fill="#0072ff" opacity="0.15" />
    <path d="M 120 70 A 50 50 0 0 1 70 120 L 70 95 A 25 25 0 0 0 95 70 Z" fill="#0072ff" opacity="0.25" />
    <path d="M 70 120 A 50 50 0 0 1 20 70 L 45 70 A 25 25 0 0 0 70 95 Z" fill="#00c6ff" opacity="0.2" />
    <path d="M 20 70 A 50 50 0 0 1 70 20 L 70 45 A 25 25 0 0 0 45 70 Z" fill="#0072ff" opacity="0.1" />

    <!-- Crowd node clusters (dots and simplified figures) -->
    <g fill="#1e3c72">
      <!-- Top cluster -->
      <circle cx="60" cy="35" r="2.5" />
      <circle cx="70" cy="32" r="3" />
      <circle cx="80" cy="36" r="2" />
      <!-- Right cluster -->
      <circle cx="102" cy="55" r="2.5" />
      <circle cx="108" cy="65" r="2" />
      <!-- Bottom cluster -->
      <circle cx="65" cy="105" r="2.5" />
      <circle cx="75" cy="108" r="3" />
      <circle cx="85" cy="104" r="2" />
      <!-- Left cluster -->
      <circle cx="38" cy="58" r="2.5" />
      <circle cx="32" cy="72" r="2" />
    </g>

    <!-- Radar Sweep Line -->
    <line x1="70" y1="70" x2="115" y2="25" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Central Location Pin -->
    <path d="M 70 38 C 59 38 50 47 50 58 C 50 73 70 95 70 95 C 70 95 90 73 90 58 C 90 47 81 38 70 38 Z" fill="url(#pinGrad)" />
    <!-- Pin Inner Dot -->
    <circle cx="70" cy="56" r="5" fill="#ffffff" />
  </g>
</svg>
